<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Nonprofit Donor &amp; Fundraising Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "donors": "pages/donors/donors.html",
  "major-gifts-grants": "pages/major-gifts-grants/major-gifts-grants.html",
  "gifts": "pages/gifts/gifts.html",
  "pledges-sustainers": "pages/pledges-sustainers/pledges-sustainers.html",
  "peer-fundraisers": "pages/peer-fundraisers/peer-fundraisers.html",
  "restricted-funds": "pages/restricted-funds/restricted-funds.html",
  "tax-receipts": "pages/tax-receipts/tax-receipts.html",
  "stewardship-analytics": "pages/stewardship-analytics/stewardship-analytics.html",
  "donor-detail": "pages/donor-detail/donor-detail.html",
  "grant-detail": "pages/grant-detail/grant-detail.html",
  "gift-drawer": "pages/gift-drawer/gift-drawer.html",
  "pledge-drawer": "pages/pledge-drawer/pledge-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
